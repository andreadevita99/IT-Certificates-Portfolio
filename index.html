<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>IT Certificates Portfolio | Andrea De Vita</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/andreadevita99/IT-Certificates-Portfolio@df48e2ed2545a9baecd42780c3e418f685e4b2ef/favicon.png"
    />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition:
          background-color 0.3s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      :root {
        --bg-page: #f4f7fc;
        --surface-card: #ffffff;
        --text-primary: #1e2a3e;
        --text-secondary: #2c3e50;
        --shadow-sm:
          0 10px 20px rgba(0, 0, 0, 0.05), 0 6px 6px rgba(0, 0, 0, 0.02);
        --shadow-hover: 0 25px 35px -12px rgba(0, 0, 0, 0.15);
        --border-light: rgba(0, 0, 0, 0.05);
        --header-border: rgba(0, 0, 0, 0.05);
      }

      body.dark {
        --bg-page: #0f172a;
        --surface-card: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --shadow-sm: 0 15px 25px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 25px 40px rgba(0, 0, 0, 0.4);
        --border-light: rgba(255, 255, 255, 0.08);
        --header-border: #334155;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg-page);
        color: var(--text-primary);
        line-height: 1.4;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
      }

      /* Header & Theme Toggle */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 2.8rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--header-border);
      }

      .title-section h1 {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(125deg, #2c7da0, #3b82f6);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.3px;
      }

      .toggle-ios {
        position: relative;
        display: inline-block;
        width: 64px;
        height: 32px;
      }

      .toggle-ios input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #cbd5e1;
        border-radius: 34px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .slider:before {
        position: absolute;
        content: "☀️";
        height: 26px;
        width: 26px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      input:checked + .slider {
        background-color: #f59e0b;
      }

      input:checked + .slider:before {
        content: "🌙";
        transform: translateX(32px);
        background-color: #1e293b;
      }

      /* Gallery Grid */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2rem;
        justify-items: center;
        align-items: stretch;
        margin-top: 1rem;
      }

      /* Card */
      .card {
        width: 100%;
        max-width: 320px;
        background: var(--surface-card);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        border: 1px solid var(--border-light);
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-hover);
      }

      .card-image {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-bottom: 1px solid var(--border-light);
        background-color: #f0f0f0; /* Fallback background while loading */
      }

      .card-title {
        padding: 1rem;
        font-weight: 600;
        text-align: center;
        font-size: 0.95rem;
        color: var(--text-secondary);
        background: var(--surface-card);
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        opacity: 0;
      }

      .modal.show {
        display: flex;
        opacity: 1;
      }

      .modal-content {
        max-width: 90vw;
        max-height: 90vh;
        border-radius: 20px;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        animation: zoomIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      }

      .modal-content img {
        max-width: 100%;
        max-height: 85vh;
        display: block;
        border-radius: 16px;
        object-fit: contain;
      }

      @keyframes zoomIn {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 680px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 1rem;
        }
        .gallery {
          gap: 1.5rem;
        }
        .card-title {
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title-section">
          <h1>📜 IT Certificates Portfolio | Andrea De Vita</h1>
        </div>
        <div class="theme-switch">
          <label class="toggle-ios">
            <input type="checkbox" id="darkModeToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="gallery" id="certGallery"></div>
    </div>

    <!-- Zoom Modal -->
    <div id="imageModal" class="modal">
      <div class="modal-content">
        <img id="modalImage" src="" alt="Enlarged certificate" />
      </div>
    </div>

    <script>
      // Certificate data (ordered)
      const certificates = [
        // --- DJI Certificates ---
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/1%20-%20Corso%20di%20Post-Produzione%20Video%20per%20Filmmakers%20DJI%20ARS.jpg",
          name: "Corso di Post-Produzione Video per Filmmakers DJI ARS",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/2%20-%20Corso%20di%20fotografia%20per%20filmmarkers%20DJI%20ARS.jpg",
          name: "Corso di fotografia per Filmmakers DJI ARS",
        },

        // --- NEW: UAS A1-A3 Exam (jsDelivr) inserted before OPEN A1/A3 ---
        {
          url: "https://cdn.jsdelivr.net/gh/andreadevita99/IT-Certificates-Portfolio@main/Prova%20di%20esame%20UAS%20A1-A3_ITA-RP-000081522act.jpg",
          name: "Prova di esame UAS A1-A3",
        },

        // --- Remaining DJI Certificates ---
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/3%20-%20Corso%20di%20preparazione%20esame%20OPEN%20A1-A3.jpg",
          name: "Corso di preparazione esame OPEN A1/A3",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/4%20-%20Regolamento%20Europeo%20Droni%20-%20EASA.jpg",
          name: "Regolamento Europeo Droni - EASA",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/5%20-%20Corso%20Drone%20Normativa%20Enac%20Sapr.jpg",
          name: "Corso Drone Normativa Enac Sapr",
        },

        // --- Legacy Certificates ---
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/1%20-%20Apple%20Education%20-%20Apple%20Teacher%20Program-1.jpg",
          name: "Apple Teacher Program - Apple Education",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/2%20-%20Corso%20Python%20-%20Codeaccess-1.jpg",
          name: "Corso Python - Codeaccess",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/3%20-%20Corso%20Cybersecurity%20e%20Ethical%20Hacking%20-%20Codeaccess-1.jpg",
          name: "Cybersecurity & Ethical Hacking - Codeaccess",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/4%20-%20Junior%20System%20%20Cybersecurity%20Analyst%20-%20Generation%20italy-1.jpg",
          name: "Junior System & Cybersecurity Analyst - Generation Italy",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/5%20-%20Introduction%20to%20Cybersecurity%20-%20Cisco-1.jpg",
          name: "Introduction to Cybersecurity - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/6-Ethical-Hacker-Cisco-1.jpg",
          name: "Ethical Hacker - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/7-Python-Essentials1-Cisco-1.jpg",
          name: "Python Essentials 1 - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/8-Introduction-to-IoT-Cisco-1.jpg",
          name: "Introduction to IoT - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/9%20-%20English%20for%20IT%201%20-%20Cisco-1.jpg",
          name: "English for IT 1 - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/10%20-%20Computer%20Hardware%20Basics%20-%20Cisco-1.jpg",
          name: "Computer Hardware Basics - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/11-Operating-Systems-Basics-Cisco-1.jpg",
          name: "Operating Systems Basics - Cisco",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/12%20-%20Talentform%20SPA%20-%20Corso%20Sistemista%20Informatico%20-%20Archimede-1.jpg",
          name: "Sistemista Hardware Informatico - Talentform",
        },
        {
          url: "https://raw.githubusercontent.com/andreadevita99/IT-Certificates-Portfolio/main/13%20-%20Certificato%20lingua%20Inglese-1.jpg",
          name: "English Language Certificate - Twin Group English Centre",
        },
      ];

      // DOM Elements
      const galleryContainer = document.getElementById("certGallery");
      const darkModeToggle = document.getElementById("darkModeToggle");
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");

      let closeTimer = null;

      // --- Theme Management ---
      function initTheme() {
        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark");
          darkModeToggle.checked = true;
        }
      }

      function toggleTheme() {
        const isDark = darkModeToggle.checked;
        document.body.classList.toggle("dark", isDark);
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      darkModeToggle.addEventListener("change", toggleTheme);
      initTheme();

      // --- Modal Management ---
      function openModal(imageUrl) {
        clearTimeout(closeTimer);
        modalImage.src = imageUrl;
        modal.classList.add("show");
        // Auto-close after 5 seconds
        closeTimer = setTimeout(closeModal, 5000);
      }

      function closeModal() {
        modal.classList.remove("show");
        clearTimeout(closeTimer);
        closeTimer = null;
        // Clean up image src after fade-out
        setTimeout(() => {
          if (!modal.classList.contains("show")) modalImage.src = "";
        }, 300);
      }

      // Close modal on background click
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      // --- Gallery Construction ---
      const fallbackImage =
        "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='320' height='240'%3E%3Crect width='320' height='240' fill='%23eee'/%3E%3Ctext x='50%' y='50%' font-family='Arial' font-size='14' fill='%23f00' text-anchor='middle'%3EImage Not Found%3C/text%3E%3C/svg%3E";

      function buildGallery() {
        certificates.forEach((cert) => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.className = "card-image";
          img.src = cert.url;
          img.alt = cert.name;
          img.loading = "lazy";
          img.onerror = function () {
            this.src = fallbackImage;
          };

          const title = document.createElement("div");
          title.className = "card-title";
          title.textContent = cert.name;

          card.appendChild(img);
          card.appendChild(title);

          card.addEventListener("click", () => openModal(cert.url));
          galleryContainer.appendChild(card);
        });
      }

      buildGallery();
    </script>
  </body>
</html>
